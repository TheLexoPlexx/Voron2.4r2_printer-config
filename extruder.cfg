#####################################################################
#   Extruder
#####################################################################

[extruder]
step_pin: ebb36rapido:PD0
dir_pin: !ebb36rapido:PD1
enable_pin: !ebb36rapido:PD2
microsteps: 32
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
# rotation_distance: 12.98969808731595   #Stealthburner Bondtech 5mm Drive Gears
rotation_distance: 35.8   #VZ Hextrudort

# gear_ratio: 50:17               #Stealthrburner BMG Gear Ratio
gear_ratio: 60:10               #VZ Hextrudort
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.6
filament_diameter: 1.75
heater_pin: ebb36rapido:PB13
# sensor_type: Generic 3950 # Stealthburner
sensor_type: MAX31865
sensor_pin: ebb36rapido:PA4

max_extrude_only_distance: 200

spi_bus: spi1
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2
rtd_use_50Hz_filter: True

min_temp: 0
max_temp: 350
max_power: 1.0
min_extrude_temp: 170 #170
##  Try to keep pressure_advance below 1.0
pressure_advance: 0.025 ### von Chriss
#pressure_advance_smooth_time: 0.040 # ist eh Default is 0.040, leave stock

##  E0 on MOTOR6
##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 extruder]
uart_pin: ebb36rapido:PA15
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[extruder_stepper secondary_extruder]
extruder: extruder

##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
# rotation_distance: 4.65
rotation_distance: 4.8939
# rotation_distance: 4.94

step_pin: PE6
dir_pin: !PA14
enable_pin: !PE0
microsteps: 16

[tmc2209 extruder_stepper secondary_extruder]
uart_pin: PD3
interpolate: false
run_current: 0.85
# hold_current: 0.1
sense_resistor: 0.11
stealthchop_threshold: 0


#### turtleneck

[gcode_button turtleneck_advance]
pin: !PG14
press_gcode:
    # Buffer expanded: slow secondary feeder down. # rotation_distance * 1.03
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=secondary_extruder DISTANCE=5.04 # 4.8939 * 1.03
    # SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=secondary_extruder DISTANCE=4.7895 # 4.65 * 1.03
release_gcode:
[gcode_button turtleneck_trailing]
pin: !PG12
press_gcode:
    # Buffer compressed: speed secondary feeder up. # rotation_distance * 0.97
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=secondary_extruder DISTANCE=4.74 # 4.8939 * 0.97
    # SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=secondary_extruder DISTANCE=4.5105 # 4.65 * 0.97
release_gcode: