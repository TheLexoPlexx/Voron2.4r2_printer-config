#####################################################################
#   Extruder
#####################################################################

##  Connected to MOTOR_6
##  Heater - HE0
##  Thermistor - T0
[extruder]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4
microsteps: 32
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point
#rotation_distance: 13.02225372162   #Bondtech 5mm Drive Gears
#rotation_distance: 12.371141035539   #Bondtech 5mm Drive Gears
rotation_distance: 12.98969808731595   #Bondtech 5mm Drive Gears
gear_ratio: 50:17               #BMG Gear Ratio
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
# nozzle_diameter: 0.400
nozzle_diameter: 0.600
filament_diameter: 1.75
heater_pin: PB11
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
sensor_type: Generic 3950
sensor_pin: PF4
min_temp: 0
max_temp: 350
max_power: 1.0
min_extrude_temp: 170
#control = pid
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721
##  Try to keep pressure_advance below 1.0
# pressure_advance: 0.0755 ### Mit Tower gemessen, wahrscheinlich falsch
pressure_advance: 0.025 ### von Chriss
# pressure_advance: 0.0482 ## auch mit Tower gemessen, wahrscheinlich falsch
##  Default is 0.040, leave stock
#pressure_advance_smooth_time: 0.040
max_extrude_cross_section: 24

##  E0 on MOTOR6
##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 extruder]
uart_pin: PE1
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[verify_heater extruder]
max_error: 120

[extruder_stepper secondary_extruder]
extruder: extruder

microsteps: 16
full_steps_per_rotation: 200

##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
# rotation_distance: 4.637
rotation_distance: 4.94

step_pin: PE6
dir_pin: !PA14
enable_pin: !PE0
microsteps: 16

[tmc2209 extruder_stepper secondary_extruder]
uart_pin: PD3
interpolate: false
run_current: 0.85
# hold_current: 0.1
sense_resistor: 0.11
stealthchop_threshold: 0
