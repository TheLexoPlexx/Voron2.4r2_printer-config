[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_41003D000151303530353135-if00
restart_method: command

[mcu cartographer] # See https://www.klipper3d.org/Config_Reference.html#mcu
# Remove either the serial or canbus_uuid line dependant on your setup.
canbus_uuid: edb000075a67

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 22
verbose: yes # For extra output

[safe_z_home]
home_xy_position: 175, 175
z_hop: 10

[printer]
kinematics: corexy
max_velocity: 700
max_accel: 2400
# Bei 900 Speed und 9000 Accel gabs den letzten Crash beim Speed-Test.
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

[virtual_sdcard]
path: ~/printer_data/gcodes
[display_status]
[pause_resume]

[idle_timeout]
timeout: 900

[include steppers.cfg]
[include extruder.cfg]
[include bed_heater.cfg]
[include temperature_sensors.cfg]
[include chamber_lights.cfg]

[exclude_object] #postprocess_cancellation
[respond]

[gcode_arcs]
resolution: 0.1

[adxl345]
cs_pin: cartographer:PA3
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 20
# Das hier kann irgendwann wieder weg: 
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0

# [input_shaper]
# shaper_type_x: ei
# shaper_freq_x: 51.2
# shaper_type_y: ei
# shaper_freq_y: 42.2

[include bed_mesh.cfg]
[include fans.cfg]
[include macros.cfg]
[include quad_gantry_level.cfg]

[include mainsail.cfg]
[include stealthburner.cfg]

