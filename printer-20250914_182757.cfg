[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_41003D000151303530353135-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 700
max_accel: 2400
# Bei 900 Speed und 9000 Accel gabs den letzten Crash beim Speed-Test.
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

[idle_timeout]
timeout: 180

[include steppers.cfg]
[include extruder.cfg]
[include bed_heater.cfg]
[include temperature_sensors.cfg]
[include chamber_lights.cfg]

[exclude_object] #postprocess_cancellation
[respond]

[gcode_arcs]
resolution: 0.1

[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
# for stealthburner
axes_map: -z,-y,-x #stealtburner lateral mount 

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 50  # an example

[input_shaper]
shaper_type_x: ei
shaper_freq_x: 51.2
shaper_type_y: ei
shaper_freq_y: 42.2

[include probe.cfg]
[include bed_mesh.cfg]
[include fans.cfg]
[include macros.cfg]
[include quad_gantry_level.cfg]

[include mainsail.cfg]
[include stealthburner.cfg]

[include KAMP/*cfg]

